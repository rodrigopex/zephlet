CONFIG_ZBUS=y
CONFIG_ZEPHLETS=y
CONFIG_ZEPHLETS_SHELL=y
CONFIG_NANOPB=y

CONFIG_ZEPHLET_TICK=y
CONFIG_ZEPHLET_UI=y

CONFIG_LOG=y
CONFIG_ASSERT=y

CONFIG_SHELL=y
# The shell's PTY UART defaults to a new pseudoterminal the pytest
# harness (piping the DUT's own stdin/stdout) can't reach; route it to
# stdin/stdout instead, same as the coap_functional connmgr case.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

CONFIG_MAIN_STACK_SIZE=2048
