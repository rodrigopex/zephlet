CONFIG_ZBUS=y
CONFIG_ZEPHLETS=y
CONFIG_ZEPHLETS_SHELL=y
CONFIG_NANOPB=y

CONFIG_ZEPHLET_TICK=y
CONFIG_ZEPHLET_UI=y
CONFIG_ZEPHLET_TYPELAB=y

CONFIG_LOG=y
CONFIG_ASSERT=y

# typelab_bench's f_float/f_double (and set_float/set_double) need these
# or the shell prints the literal "%g" instead of the value — cbprintf
# drops float conversions without them.
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_SHELL=y
# The shell's PTY UART defaults to a new pseudoterminal the pytest
# harness (piping the DUT's own stdin/stdout) can't reach; route it to
# stdin/stdout instead, same as the coap_functional connmgr case.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
# Default (20) counts every token including "zlet"/the instance name/
# the rpc name itself, so typelab_bench's 18-field `config` call (21
# tokens total) overflows it with "Too many arguments in the command."
# Any app exposing a many-field Config through the aggregate config/
# get_config rpc can hit this same ceiling — bump it generously.
CONFIG_SHELL_ARGC_MAX=32
# Default (80) wraps typelab_bench's 18-field `config` command across
# two physical lines when the shell echoes it back — harmless for a
# real console, but breaks pytest's Shell.exec_command(), which matches
# the echoed command against a single line.
CONFIG_SHELL_DEFAULT_TERMINAL_WIDTH=400

CONFIG_MAIN_STACK_SIZE=2048
