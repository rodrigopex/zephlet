CONFIG_ZBUS=y
CONFIG_ZEPHLETS=y
CONFIG_ZEPHLETS_SHELL=y
CONFIG_NANOPB=y

CONFIG_ZEPHLET_TICK=y
CONFIG_ZEPHLET_UI=y
CONFIG_ZEPHLET_TYPELAB=y

CONFIG_LOG=y
CONFIG_ASSERT=y

# typelab_bench's f_float/f_double need float formatting; the library's
# NANOPB_TEXTFORMAT_FLOAT already selects CBPRINTF_FP_SUPPORT, but
# CBPRINTF_COMPLETE is ours to set.
CONFIG_CBPRINTF_COMPLETE=y
# f_uint64/f_int64/f_fixed64/f_sfixed64 print wrongly rather than
# imprecisely without full integral conversion.
CONFIG_CBPRINTF_FULL_INTEGRAL=y

CONFIG_SHELL=y
# The shell's PTY UART defaults to a new pseudoterminal the pytest
# harness (piping the DUT's own stdin/stdout) can't reach; route it to
# stdin/stdout instead, same as the coap_functional connmgr case.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
# The whole command line, not just the message. Text format names every
# field it sets, so it is considerably more verbose than the positional
# form this replaced: typelab_bench's every-field `config` call runs to
# roughly 460 characters, well past the 256-byte default.
CONFIG_SHELL_CMD_BUFF_SIZE=1024
# The harness writes a command far faster than the shell drains it, and
# the serial RX ring buffer defaults to 64 bytes — a long line would be
# truncated mid-parse.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
# The shell wraps its echo of the command at this width, and pytest's
# Shell.exec_command() matches that echo against a *single* line — so a
# wrapped echo fails the test even when the command itself worked
# perfectly. Harmless on a real console, fatal here. Must stay above the
# longest command any test sends; typelab_bench's every-field `config`
# call is ~460 characters, so 400 was no longer enough once arguments
# became text format.
CONFIG_SHELL_DEFAULT_TERMINAL_WIDTH=1024

CONFIG_MAIN_STACK_SIZE=2048
