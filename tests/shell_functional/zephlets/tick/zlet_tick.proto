syntax = "proto3";

import "nanopb.proto";
import "zephlet.proto";

option (nanopb_fileopt).long_names = false;

message Tick {
  message Config {
    uint32 duration_ms = 1;
    uint32 period_ms = 2;
  }

  message Events {
    int32 timestamp = 1;
  }
}

service TickApi {
  rpc start(Empty) returns (Lifecycle.Status);
  rpc stop(Empty) returns (Lifecycle.Status);
  rpc get_status(Empty) returns (Lifecycle.Status);
  /* Names are normative (base lifecycle in zephlet.proto); types are
   * per-zephlet overrides. */
  rpc config(Tick.Config) returns (Tick.Config);
  rpc get_config(Empty) returns (Tick.Config);
  /* Custom rpc — exercises a shell subcommand beyond the base set. */
  rpc kick(Empty) returns (Lifecycle.Status);
}
