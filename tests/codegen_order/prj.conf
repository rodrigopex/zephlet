# Build-only fixture: one zephlet (`tick`, reused from the
# coap_functional fixtures) plus the `consumer` library that includes its
# generated interface header. CoAP stays off; the generated coap
# interface is inert without CONFIG_ZEPHLETS_COAP.
CONFIG_ZEPHLETS=y
CONFIG_ZEPHLET_TICK=y
CONFIG_NANOPB=y
CONFIG_ZBUS=y
CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=2048
