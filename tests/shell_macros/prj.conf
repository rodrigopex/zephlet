CONFIG_ZTEST=y

CONFIG_ZEPHLETS=y
CONFIG_ZEPHLETS_SHELL=y

CONFIG_NANOPB=y

# The dummy shell backend gives the print-side tests a real
# `const struct shell *` plus a capturable output buffer, with no
# console/UART. Default buf size (300) is too small for one round-trip
# print of all 18 Fixture fields; size it generously.
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=4096

CONFIG_LOG=y
CONFIG_ASSERT=y

# zlet_shell_print_float()/_double() use "%g" — cbprintf drops floating
# point format specifiers unless explicitly built with FP support.
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
