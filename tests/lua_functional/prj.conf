CONFIG_ZBUS=y
CONFIG_ZEPHLETS=y
CONFIG_NANOPB=y
CONFIG_ZEPHLET_PROBE=y

CONFIG_LUA=y
CONFIG_LUA_ASYNC=y
CONFIG_LUA_LIBS_ALL=y
CONFIG_ZEPHLETS_LUA=y
# The suite allocates freely (closures, tracebacks); on a 64-bit host Lua
# objects and heap chunks are larger too. Lua starts a cycle once the heap
# reaches 250% of what the last one kept, so with about 60 KB live a 128 KB
# heap runs out first and allocations fail depending on fragmentation. It
# stays under the 262136 bytes a small-only sys_heap (32-bit native_sim)
# allows.
CONFIG_ZEPHLETS_LUA_HEAP_SIZE=245760

# Bursts of events go through the zbus message pool twice: once to the
# forwarding listener, once as a doorbell.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32

# Lua's print() and the suite summary go straight to the console, in order.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_THREAD_NAME=y
